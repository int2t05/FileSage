version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite-toolchain:
        applies-to: version-updates
        # Vite 与 React 插件需同步更新，避免 peer 依赖冲突。
        update-types:
          - major
        patterns:
          - vite
          - "@vitejs/plugin-react"
