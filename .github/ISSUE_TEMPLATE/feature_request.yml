name: Feature request
description: Suggest a user-facing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior that would help.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or examples
    validations:
      required: false
