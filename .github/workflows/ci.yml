name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          unformatted_go_files="$(find cmd internal test -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted_go_files" ]; then
            printf '%s\n' "$unformatted_go_files"
            exit 1
          fi
      - name: Verify systemd service unit
        run: |
          # 固定生产路径需要可执行文件，CI 用无副作用占位程序满足静态校验。
          sudo install -D -m 0755 /usr/bin/true /usr/local/lib/filesage/filesage
          systemd-analyze verify deploy/filesage.service
      - run: go test -count=1 ./...
      - name: Check Agent request-context logging for races
        run: go test -race -count=1 ./internal/logging ./internal/httpapi ./internal/agent
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go build ./...

  frontend:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --registry=https://registry.npmjs.org/ --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Build and smoke-test Linux release package
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/filesage ./cmd/filesage
          output="$(bash scripts/package-release.sh v0.0.0 "$GITHUB_SHA")"
          printf '%s\n' "$output"
          archive="$(printf '%s\n' "$output" | sed -n 's/^archive=//p')"
          bash scripts/smoke-release-package.sh "$archive" filesage_v0.0.0_linux_amd64
