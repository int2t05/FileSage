name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish Linux package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Go formatting
        run: |
          unformatted_go_files="$(find cmd internal test -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted_go_files" ]; then
            printf '%s\n' "$unformatted_go_files"
            exit 1
          fi
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Linux server
        run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/filesage ./cmd/filesage
      - name: Verify web and dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --registry=https://registry.npmjs.org/ --audit-level=high
          npm test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Package release
        id: package
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          bundle="filesage_${version}_linux_amd64"
          stage="dist/$bundle"
          mkdir -p "$stage/web" "$stage/deploy" "$stage/docs" "$stage/LICENSES"
          install -m 0755 dist/filesage "$stage/filesage"
          cp -R web/dist/. "$stage/web/"
          cp deploy/filesage.service deploy/filesage.env.example "$stage/deploy/"
          cp docs/DEPLOYMENT.md "$stage/docs/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          cp -R LICENSES/. "$stage/LICENSES/"
          {
            printf 'Version: %s\n' "$version"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Go: %s\n' "$(go version)"
            printf 'Node: %s\n' "$(node --version)"
            printf 'npm: %s\n' "$(npm --version)"
          } > "$stage/BUILDINFO.txt"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          archive="$bundle.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -cf - -C dist "$bundle" | gzip -n > "dist/$archive"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          tar -tzf "dist/$archive" >/dev/null
          (cd dist && sha256sum -c "$archive.sha256")
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$archive.sha256" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.checksum }}" --verify-tag --title "FileSage $GITHUB_REF_NAME" --generate-notes
