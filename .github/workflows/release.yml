name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish Linux package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check Go formatting
        run: |
          unformatted_go_files="$(find cmd internal test -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted_go_files" ]; then
            printf '%s\n' "$unformatted_go_files"
            exit 1
          fi
      - run: go test -count=1 ./...
      - name: Check Agent request-context logging for races
        run: go test -race -count=1 ./internal/logging ./internal/httpapi ./internal/agent
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Linux server
        run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/filesage ./cmd/filesage
      - name: Verify web and dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --registry=https://registry.npmjs.org/ --audit-level=high
          npm test
          npm run typecheck
          npm run typecheck:native
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Package release
        id: package
        run: |
          set -euo pipefail
          output="$(bash scripts/package-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          printf '%s\n' "$output" >> "$GITHUB_OUTPUT"
      - name: Smoke-test release package
        run: |
          set -euo pipefail
          bundle="filesage_"$GITHUB_REF_NAME"_linux_amd64"
          bash scripts/smoke-release-package.sh "dist/$bundle.tar.gz" "$bundle"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.checksum }}" --verify-tag --title "FileSage $GITHUB_REF_NAME" --generate-notes
